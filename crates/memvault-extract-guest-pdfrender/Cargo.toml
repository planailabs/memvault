[package]
name = "memvault-extract-guest-pdfrender"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
memvault-extract-abi = { path = "../memvault-extract-abi" }
extism-pdk = "1"
hayro = "0.7"
pdfplumber = { version = "0.2", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
