[package]
name = "memvault-attach"
version = "0.1.0"
edition = "2024"

[dependencies]
memvault-store = { path = "../memvault-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
sha2 = "0.10"
blake3 = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
