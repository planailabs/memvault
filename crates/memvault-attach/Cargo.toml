[package]
name = "memvault-attach"
version = "0.1.0"
edition = "2024"

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-store = { path = "../memvault-store" }
cid = "0.11"
multihash-codetable = { version = "0.2", features = ["sha2"] }
multihash = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
sha2 = "0.10"
blake3 = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
