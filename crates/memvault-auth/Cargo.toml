[package]
name = "memvault-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
memvault-core = { path = "../memvault-core" }
cid = "0.11"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-big-array = "0.5"
serde_ipld_dagcbor = "0.6"
ed25519-dalek = { version = "2", features = ["serde"] }
thiserror = "2"
data-encoding = "2"
rand = "0.8"
base64 = "0.22"
serde_json = "1"
hex = "0.4"

[dev-dependencies]
