[package]
name = "memvault-core"
version = "0.1.0"
edition = "2024"

[dependencies]
cid = "0.11"
multihash-codetable = { version = "0.2", features = ["blake3", "sha2"] }
multihash = "0.19"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_ipld_dagcbor = "0.6"
ipld-core = "0.4"
blake3 = "1"
ed25519-dalek = { version = "2", features = ["serde"] }
thiserror = "2"
glob = "0.3"
rand = "0.8"
bs58 = "0.5"
serde_json = "1"
hex = "0.4"
tracing = "0.1"

# wasm32-unknown-unknown has no `std::time::SystemTime::now()`; reach for
# the browser's `Date.now()` via js-sys on that target so `wall_ns()`
# returns a real timestamp instead of panicking at runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
