[package]
name = "memvault-api"
version = "0.1.0"
edition = "2024"

[features]
default = []
http-client = ["dep:reqwest"]
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-auth = { path = "../memvault-auth" }
memvault-store = { path = "../memvault-store" }
memvault-doc = { path = "../memvault-doc" }
memvault-attach = { path = "../memvault-attach" }
memvault-extract = { path = "../memvault-extract" }
memvault-query = { path = "../memvault-query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = "0.6"
data-encoding = "2"
ed25519-dalek = { version = "2", features = ["serde"] }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
mime_guess = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { workspace = true, optional = true, features = ["multipart"] }
opentelemetry = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }


[dev-dependencies]
tempfile = "3"
