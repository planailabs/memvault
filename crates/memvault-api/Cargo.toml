[package]
name = "memvault-api"
version = "0.1.0"
edition = "2024"

[features]
default = []
otel = ["dep:opentelemetry", "dep:tracing-opentelemetry"]

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-auth = { path = "../memvault-auth" }
memvault-store = { path = "../memvault-store" }
memvault-doc = { path = "../memvault-doc" }
memvault-attach = { path = "../memvault-attach" }
memvault-extract = { path = "../memvault-extract" }
memvault-query = { path = "../memvault-query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
mime_guess = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

[[bin]]
name = "memctl"
path = "src/bin/memctl.rs"

[dev-dependencies]
tempfile = "3"
