[package]
name = "memvault-import"
version = "0.1.0"
edition = "2024"

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-doc = { path = "../memvault-doc" }
memvault-api = { path = "../memvault-api", features = ["http-client"] }
memvault-query = { path = "../memvault-query" }
memvault-store = { path = "../memvault-store" }
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "memvault-import"
path = "src/bin/memvault-import.rs"
