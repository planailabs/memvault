[package]
name = "memvault-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-doc = { path = "../memvault-doc" }
memvault-api = { path = "../memvault-api" }
memvault-store = { path = "../memvault-store" }
memvault-query = { path = "../memvault-query" }
memvault-auth = { path = "../memvault-auth" }
memvault-net = { path = "../memvault-net" }
memctl = { path = "../memctl", default-features = false }
libp2p = { workspace = true }
futures = "0.3"
serde_ipld_dagcbor = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["serde"] }
hex = "0.4"

[lib]
name = "memvault_smoke"
path = "src/lib.rs"
