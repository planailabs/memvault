[package]
name = "memvault-mcp"
version = "0.1.0"
edition = "2024"

[lib]
name = "memvault_mcp"
path = "src/lib.rs"

[[bin]]
name = "memvault-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { workspace = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

memvault-core = { path = "../memvault-core" }
memvault-doc = { path = "../memvault-doc" }
memvault-query = { path = "../memvault-query" }
memvault-api = { path = "../memvault-api", features = ["http-client"] }
memvault-auth = { path = "../memvault-auth" }
memvault-export = { path = "../memvault-export" }
base64 = "0.22"
hex = "0.4"
mime_guess = "2"
ed25519-dalek = "2"
rand = "0.8"
reqwest = { workspace = true, features = ["json"] }
# The workspace's reqwest uses `rustls-no-provider`; install the ring
# provider at startup (see `lib::run`).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_ipld_dagcbor = "0.6"
