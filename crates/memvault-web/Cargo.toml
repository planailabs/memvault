[package]
name = "memvault-web"
version = "0.1.0"
edition = "2024"

[lib]
name = "memvault_web"
path = "src/lib.rs"

[[bin]]
name = "memvault-web"
path = "src/main.rs"
required-features = ["webui"]

[features]
default = ["web", "server"]
web = ["webui", "dioxus/web", "dep:getrandom"]
webui = ["dep:dioxus", "dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:pulldown-cmark", "dep:dioxus-i18n", "dep:unic-langid", "dep:gloo-timers"]
embed = ["dioxus?/embed"]
server = [
    "webui", "dioxus/server",
    "dep:memvault-api", "dep:memvault-doc", "dep:memvault-query", "dep:memvault-auth", "dep:memvault-store",
    "dep:memvault-extract-abi",
    "dep:axum", "dep:tokio", "dep:tokio-stream",
    "dep:tower", "dep:tower-http", "dep:thiserror",
    "dep:dirs", "dep:rand", "dep:ed25519-dalek",
]

[dependencies]
memvault-core = { path = "../memvault-core" }
plan-ai-design = { path = "../../../plan-ai-design" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = "0.6"
tracing = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# UI dependencies (behind webui feature)
dioxus = { version = "0.8.0-alpha.0", features = ["fullstack", "router"], optional = true }
wasm-bindgen = { version = "=0.2.121", optional = true }
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Event", "KeyboardEvent", "Window", "Location"], optional = true }
js-sys = { version = "0.3", optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
pulldown-cmark = { version = "0.12", optional = true }
dioxus-i18n = { version = "0.5", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
thiserror = { version = "2", optional = true }

# Server-only dependencies (not compiled for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
memvault-api = { path = "../memvault-api", optional = true }
memvault-store = { path = "../memvault-store", optional = true }
dirs = { version = "6", optional = true }
rand = { version = "0.8", optional = true }
memvault-doc = { path = "../memvault-doc", optional = true }
memvault-query = { path = "../memvault-query", optional = true }
memvault-auth = { path = "../memvault-auth", optional = true }
memvault-extract-abi = { path = "../memvault-extract-abi", optional = true }
ed25519-dalek = { version = "2", optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
