[package]
name = "memvault-web"
version = "0.1.0"
edition = "2024"

[features]
default = ["server"]
web = ["webui", "dioxus/web"]
webui = ["dep:dioxus", "dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:pulldown-cmark", "dep:dioxus-i18n", "dep:unic-langid"]
server = ["webui", "dioxus/server"]

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-api = { path = "../memvault-api" }
memvault-doc = { path = "../memvault-doc" }
memvault-query = { path = "../memvault-query" }
memvault-auth = { path = "../memvault-auth" }
plan-ai-design = { path = "../../../plan-ai-design" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

# UI dependencies (behind webui feature)
dioxus = { version = "0.7", features = ["fullstack", "router"], optional = true }
wasm-bindgen = { version = "=0.2.114", optional = true }
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Event", "KeyboardEvent", "Window", "Location"], optional = true }
js-sys = { version = "0.3", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
dioxus-i18n = { version = "0.5", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
