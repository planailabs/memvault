[package]
name = "memvault-web"
version = "0.1.0"
edition = "2024"

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-api = { path = "../memvault-api" }
memvault-doc = { path = "../memvault-doc" }
memvault-query = { path = "../memvault-query" }
memvault-auth = { path = "../memvault-auth" }
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
thiserror = "2"
tracing = "0.1"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = "0.1"
