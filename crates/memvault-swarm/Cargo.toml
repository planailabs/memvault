[package]
name = "memvault-swarm"
version = "0.1.0"
edition = "2024"

[dependencies]
memvault-core = { path = "../memvault-core" }
memvault-store = { path = "../memvault-store" }
memvault-net = { path = "../memvault-net" }
memvault-attach = { path = "../memvault-attach" }
memvault-auth = { path = "../memvault-auth" }
ed25519-dalek = "2"
libp2p = { workspace = true }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde_ipld_dagcbor = "0.6"
serde_json = "1"
tracing = "0.1"
hex = "0.4"
prost = "0.13"
