[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rmcp = { version = "0.17", default-features = false, features = ["server", "transport-io", "macros"] }
libp2p = { version = "0.56", default-features = false, features = ["tokio", "noise", "yamux", "quic", "tcp", "mdns", "request-response", "identify", "ping", "gossipsub", "kad", "macros", "serde", "ed25519"] }

# NOTE: [patch] cannot be inherited across workspaces — it only applies from the
# root of the build currently in progress. When memvault is built standalone,
# these patches govern the graph. When built as part of the parent mac-mgmt
# workspace, the PARENT's [patch] tables apply instead and these are ignored.
# Keep the dioxus entries in sync with the parent Cargo.toml.
[patch.crates-io]
dioxus = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-server = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-i18n = { git = "https://github.com/mkg20001/dioxus-i18n.git", branch = "feat/dioxus-0.8" }

# memvault-web depends on plan-ai-design by git URL (see its Cargo.toml) so the
# same manifest works in both layouts. Standalone, redirect that URL to the
# nested submodule checkout; in the parent workspace the parent redirects it to
# the top-level plan-ai-design instead.
[patch."ssh://git@git.plan.ai/plan-ai/design"]
plan-ai-design = { path = "plan-ai-design" }
